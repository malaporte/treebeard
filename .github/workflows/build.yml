name: Build

on:
  push:
    tags: [v*]

jobs:
  build-mac:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
        working-directory: packages/treebeard

      - name: Build and package
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        working-directory: packages/treebeard
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PWD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          for cert in AppleWWDRCAG3 AppleWWDRCAG6 AppleWWDRCAG7; do
            curl -fsSL "https://www.apple.com/certificateauthority/${cert}.cer" \
              | security import /dev/stdin -k "$KEYCHAIN_PATH" 2>/dev/null || true
          done
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          bun run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Treebeard-mac
          path: |
            packages/treebeard/artifacts/*.dmg
            packages/treebeard/artifacts/*.tar.zst
            packages/treebeard/artifacts/*-update.json
          retention-days: 30

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/treebeard/artifacts/*.dmg
            packages/treebeard/artifacts/*.tar.zst
            packages/treebeard/artifacts/*-update.json
